services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
    ports:
      - "127.0.0.1:${POLARIS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - polaris-postgres:/var/lib/postgresql

  polaris:
    build: .
    environment:
      POLARIS_DATABASE_URL: postgres://polaris:polaris@postgres:5432/polaris?sslmode=disable
      POLARIS_HTTP_ADDRESS: :8080
      POLARIS_WORKER_INTERVAL_SECONDS: "10"
      POLARIS_OIDC_ISSUER: ${POLARIS_OIDC_ISSUER:-https://accounts.google.com}
      POLARIS_OIDC_CLIENT_ID: ${POLARIS_OIDC_CLIENT_ID:?set POLARIS_OIDC_CLIENT_ID in .env}
      POLARIS_AUTHORIZED_EMAIL: ${POLARIS_AUTHORIZED_EMAIL:-claudioed.oliveira@gmail.com}
      POLARIS_INGEST_SECRET_KEY: ${POLARIS_INGEST_SECRET_KEY:?set POLARIS_INGEST_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${POLARIS_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  control-tower:
    build:
      context: ./web
      args:
        VITE_GOOGLE_CLIENT_ID: ${POLARIS_OIDC_CLIENT_ID:?set POLARIS_OIDC_CLIENT_ID in .env}
    ports:
      - "127.0.0.1:${POLARIS_CONTROL_TOWER_PORT:-3000}:8080"
    depends_on:
      - polaris

  # Warehouse (IQVO) frontends, prebuilt images. Both serve at the root of
  # their port (the /catalog/ prefix only exists behind the kind cluster's
  # web-gateway, not in the image itself).
  landing-page:
    image: ghcr.io/iqvo/landing-page:${LANDING_PAGE_TAG:-v0.1.1}
    platform: linux/amd64
    ports:
      - "127.0.0.1:${POLARIS_LANDING_PAGE_PORT:-8081}:8080"

  ecosystem:
    # :dev is a LOCAL build (arm64 on this Mac); it is not published on GHCR,
    # so never try to pull it. Published releases (latest/vX.Y.Z, amd64) come
    # from the ecosystem repo's docker-publish workflow on main/tags.
    image: ghcr.io/iqvo/ecosystem:${ECOSYSTEM_TAG:-dev}
    pull_policy: never
    ports:
      - "127.0.0.1:${POLARIS_ECOSYSTEM_PORT:-8082}:8080"

  # Public TLS edge; started only with --profile edge. See
  # docs-site/docs/introduction/deployment.md for the full domain setup.
  edge:
    image: caddy:2-alpine
    profiles: ["edge"]
    environment:
      POLARIS_DOMAIN: ${POLARIS_DOMAIN:-polaris-harness.cloud}
      # https://iqvo.cloud is forwarded to the landing-page service.
      IQVO_DOMAIN: ${IQVO_DOMAIN:-iqvo.cloud}
    ports:
      - "${POLARIS_EDGE_HTTP_PORT:-80}:80"
      - "${POLARIS_EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - control-tower
      - landing-page

volumes:
  polaris-postgres:
  caddy-data:
  caddy-config:
